name: Keep the AI Guide search service awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          SEARCH_SERVICE_URL: ${{ vars.SEARCH_SERVICE_URL }}
        run: |
          if [ -z "$SEARCH_SERVICE_URL" ]; then
            echo "SEARCH_SERVICE_URL is not set, nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 "${SEARCH_SERVICE_URL%/}/health"
