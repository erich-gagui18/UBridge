<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile · UBridge</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236b1a1c'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='800' text-anchor='middle' fill='%23d9bd45' font-family='Arial'%3EUB%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../assets/css/styles.css"></head>
<body data-page="profile"><div id="app"><main id="main">
<div class="head"><div><h1>My profile</h1><p class="sub" id="sub"></p></div><div><span class="pill" id="state"></span></div></div>
<div class="notice" id="need" hidden role="status"></div>
<form id="f" novalidate>
<section class="card sec"><div class="prof-top"><span class="avatar" id="av" aria-hidden="true"></span><div><b id="pName"></b><br><small class="muted" id="pRole"></small></div></div>
<h2><span class="step">1</span>Account</h2><p class="hint formnote">Your email and role come from your UBridge account and can’t be changed here.</p>
<div class="cols"><div class="field"><label for="email">Email address</label><input id="email" readonly><p class="err"></p></div>
<div class="field"><label for="role">Role</label><input id="role" readonly><p class="err"></p></div></div></section>
<section class="card sec"><h2><span class="step">2</span>Your details</h2><p class="hint formnote" id="detNote"></p><div class="cols" id="cols"></div></section>
<div class="actions"><button class="btn primary" id="save">Save profile</button></div>
</form>
</main></div><script type="module" src="../assets/js/pages/profile.js"></script></body></html>
