<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Complaints · UBridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236b1a1c'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='800' text-anchor='middle' fill='%23d9bd45' font-family='Arial'%3EUB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="my-complaints">
  <div id="app">
    <main id="main" tabindex="-1">
      <div id="listView">
        <div class="head">
          <div>
            <h1 id="t"></h1>
            <p class="sub" id="s"></p>
          </div>
          <div id="cta"></div>
        </div>
        <section class="stats" id="stats" aria-label="Summary"></section>
        <section class="card panel">
          <div class="tools">
            <input id="q" type="search" placeholder="Search name, case no., ID, type, program or filer" aria-label="Search complaints">
            <select id="st" aria-label="Filter by status"><option value="">All statuses</option></select>
          </div>
          <div class="wrap">
            <table>
              <thead id="head"></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="none" class="empty" hidden><b>No complaints match</b>Clear the search or filter to see everything.</div>
        </section>
      </div>
      <section id="caseView" class="case-page" hidden></section>
    </main>
  </div>
  <script type="module" src="../assets/js/pages/my-complaints.js"></script>
</body>
</html>
